name: Build Example

on: 
  push:
    branches:
      - main
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0     
        
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
      
      - name: Build the code
        run: npm install 
        
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v1.6.0

