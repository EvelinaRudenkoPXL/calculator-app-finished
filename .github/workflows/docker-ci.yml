name: Docker CI

on:
  workflow_dispatch:  # 🔹 Manueel starten via de Actions-tab
    inputs:
      release:
        description: 'Optional: specify a git tag for release'
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Code ophalen uit je repo
      - name: Checkout code
        uses: actions/checkout@v5

      # 2️⃣ Login bij Docker Hub met secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Buildx setup (nodig voor moderne Docker builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Bepaal de juiste tag (latest of release)
      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "tag=${{ github.event.inputs.release }}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      # 5️⃣ Build en push Docker image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/calculator-app:${{ steps.vars.outputs.tag }}

      # 6️⃣ Extra: Scan image op kwetsbaarheden
      - name: Scan Docker image for CVEs
        uses: docker/scout-action@v1
        with:
          image: ${{ vars.DOCKERHUB_USERNAME }}/calculator-app:${{ steps.vars.outputs.tag }}
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          summary: true
